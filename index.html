*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}button,input,select{font:inherit}button{cursor:pointer} .app{max-width:1180px;margin:auto;padding:22px 22px 60px}.top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:24px}.brand{display:flex;align-items:center;gap:12px}.logo{width:44px;height:44px;border-radius:14px;background:var(--primary);color:white;display:grid;place-items:center;font-weight:800;font-size:17px;letter-spacing:-1px}.brand h1{font-size:18px;line-height:1.3;margin:0}.brand small{color:var(--muted);font-size:12px}.top-actions{display:flex;gap:8px}.iconbtn,.btn{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:11px;padding:9px 13px}.iconbtn{width:42px;height:42px;padding:0}.btn.primary{background:var(--primary);border-color:var(--primary);color:white}.btn.primary:hover{background:var(--primary2)}.btn.soft{background:var(--soft);border-color:transparent;color:var(--primary)}.btn.danger{color:var(--red)}.layout{display:grid;grid-template-columns:220px minmax(0,1fr);gap:22px}.sidebar{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:12px;height:max-content;position:sticky;top:16px;box-shadow:var(--shadow)}.navlabel{color:var(--muted);font-size:11px;letter-spacing:1px;padding:10px 11px 5px}.nav{width:100%;display:flex;align-items:center;gap:11px;text-align:left;padding:11px;border:0;border-radius:11px;background:transparent;color:var(--muted);margin:2px 0}.nav.active{background:var(--soft);color:var(--primary);font-weight:650}.nav .ic{width:20px;text-align:center;font-size:17px}.side-note{margin:16px 8px 7px;padding:12px;background:var(--bg);border-radius:12px;color:var(--muted);font-size:12px}.main{min-width:0}.pagehead{display:flex;align-items:flex-end;justify-content:space-between;gap:15px;margin:3px 0 18px}.pagehead h2{font-size:24px;margin:0 0 3px;letter-spacing:-.5px}.sub{color:var(--muted);font-size:13px}.grid{display:grid;gap:14px}.stats{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:18px}.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:19px;box-shadow:var(--shadow);min-width:0}.stat-label{color:var(--muted);font-size:12px}.stat-num{font-size:27px;font-weight:750;margin-top:5px;letter-spacing:-.5px}.stat-foot{font-size:11px;color:var(--muted);margin-top:1px}.homegrid{grid-template-columns:1.35fr 1fr}.section-title{font-size:15px;font-weight:700;margin:0 0 14px}.quick-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.quick{border:1px solid var(--line);background:var(--panel);border-radius:14px;padding:15px;text-align:left;color:var(--text)}.quick:hover{border-color:var(--primary)}.quick b{display:block;margin:5px 0 1px}.quick small{color:var(--muted)}.quick .qic{font-size:22px}.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden}.bar>i{display:block;height:100%;background:var(--primary);border-radius:99px}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.muted{color:var(--muted)}.pill{display:inline-flex;align-items:center;border-radius:99px;padding:3px 9px;font-size:11px;background:var(--soft);color:var(--primary);font-weight:650}.pill.green{background:var(--greenbg);color:var(--green)}.pill.red{background:var(--redbg);color:var(--red)}.pill.amber{background:var(--amberbg);color:var(--amber)}.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:14px}.field{border:1px solid var(--line);border-radius:11px;background:var(--panel);color:var(--text);padding:10px 12px;min-width:0}.search{flex:1;min-width:180px}.question{padding:23px}.qmeta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;color:var(--muted);font-size:12px;margin-bottom:13px}.qstem{font-size:19px;line-height:1.7;font-weight:650;margin:0 0 19px;white-space:pre-wrap}.options{display:grid;gap:10px}.option{width:100%;display:flex;align-items:flex-start;gap:12px;text-align:left;padding:13px 14px;border:1px solid var(--line);border-radius:13px;background:var(--panel);color:var(--text);transition:.15s}.option:hover{border-color:var(--primary)}.option.selected{border-color:var(--primary);background:var(--soft)}.option.correct{border-color:var(--green);background:var(--greenbg)}.option.wrong{border-color:var(--red);background:var(--redbg)}.optkey{flex:none;width:27px;height:27px;border-radius:8px;background:var(--bg);display:grid;place-items:center;font-weight:700;font-size:12px}.option.selected .optkey{background:var(--primary);color:#fff}.opttext{padding-top:1px}.feedback{margin-top:17px;padding:15px;border-radius:13px;background:var(--bg);border:1px solid var(--line)}.feedback h4{margin:0 0 7px}.feedback p{margin:6px 0;white-space:pre-wrap}.explain{margin-top:13px}.explain summary{cursor:pointer;color:var(--primary);font-weight:650}.explain-body{color:var(--muted);padding:12px 2px 0;white-space:pre-wrap}.qactions{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:20px;flex-wrap:wrap}.qactions .group{display:flex;gap:8px}.progressline{height:5px;background:var(--line);border-radius:99px;margin:-23px -23px 20px;overflow:hidden}.progressline i{display:block;height:100%;background:var(--primary)}.empty{text-align:center;padding:42px 18px;color:var(--muted)}.list{display:grid;gap:10px}.listitem{display:flex;align-items:center;gap:12px;padding:14px;border:1px solid var(--line);border-radius:13px;background:var(--panel)}.listitem .grow{flex:1;min-width:0}.listitem h4{margin:0;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.listitem p{margin:3px 0 0;color:var(--muted);font-size:12px}.listitem button{flex:none}.table-like{display:grid;gap:8px}.resultrow{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}.resultrow:last-child{border:0}.examsetup{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.examsetup label{font-size:12px;color:var(--muted);display:grid;gap:6px}.examsetup input{width:100%}.answergrid{display:grid;grid-template-columns:repeat(8,1fr);gap:7px;margin-top:12px}.answergrid button{border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--muted);padding:8px 0;font-size:12px}.answergrid button.done{background:var(--soft);border-color:var(--primary);color:var(--primary)}.answergrid button.current{outline:2px solid var(--primary)}.timer{font-size:23px;font-weight:750;font-variant-numeric:tabular-nums}.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#202a3b;color:white;padding:10px 16px;border-radius:12px;z-index:20;box-shadow:var(--shadow);font-size:13px;opacity:0;pointer-events:none;transition:.2s}.toast.show{opacity:1}.modalback{position:fixed;inset:0;background:#10182888;display:grid;place-items:center;padding:18px;z-index:30}.modal{max-width:520px;width:100%;background:var(--panel);border-radius:18px;padding:22px;border:1px solid var(--line)}.modal h3{margin-top:0}.hidden{display:none!important}.footer{color:var(--muted);font-size:11px;text-align:center;margin:25px 0 0}.notice{padding:12px 14px;border-radius:12px;background:var(--amberbg);color:var(--amber);font-size:12px;margin-bottom:14px}

<script>
const BANK={"meta":{"total":196,"single":83,"multi":50,"judge":63,"missing":[13,75,77,87,103],"conflicts":[140,141,143,146,150,157,164,168],"answerVersion":"题库原始答案"},"questions":[{"id":1,"type":"single","stem":"如果要将两条不相交的线段变为相交，可使用FILLET“圆角”命令，此时要求命令处于______状态","options":[{"key":"A","text":"剪切模式但半径不为0"},{"key":"B","text":"剪切模式且半径为0"},{"key":"C","text":"不剪切模式且半径不为0"},{"key":"D","text":"不剪切模式且半径为0"}],"answer":"B","status":"verified","knowledge":"圆角半径为 0","commands":"FILLET","detail":"FILLET 用圆弧连接两对象。半径不为 0 时会生成圆弧，两条线仍可能不相交。半径为 0 且处于剪切模式时，圆弧退化为交点，系统把两条线段延伸或修剪到交点，从而“变为相交”。不剪切模式即使半径为 0，也往往保留原端点而不完成相交。所以应选剪切模式且半径为 0。","doubt":"","bank":"本题考查“FILLET”相关知识。圆角（FILLET）通过圆弧连接两个对象；半径设为0时，圆弧退化为交点处理，可使两条线段延伸/修剪到相交。是否修剪由修剪模式决定。 题库给出的答案为 B（剪切模式且半径为0）。"},{"id":2,"type":"single","stem":"矩形阵列三行相切的圆，圆半径为20，则行偏移为_____","options":[{"key":"A","text":"20"},{"key":"B","text":"30"},{"key":"C","text":"40"},{"key":"D","text":"60"}],"answer":"C","status":"verified","knowledge":"矩形阵列行距","commands":"ARRAY","detail":"相邻两行相切圆的圆心距等于两半径之和。半径都是 20，行偏移（行距）为 40。20 是半径，60 是直径加半径，都不是圆心距。","doubt":"","bank":"本题考查“矩形阵列”相关知识。矩形阵列的行偏移是相邻行基准位置之间的距离。圆半径为20且相邻圆相切时，圆心距为两个半径之和，即40；具体偏移方向由阵列设置决定。 题库给出的答案为 C（40）。"},{"id":3,"type":"single","stem":"AutoCAD是由______公司开发的计算机绘图软件","options":[{"key":"A","text":"Adobe"},{"key":"B","text":"Autodesk"},{"key":"C","text":"Microsoft"},{"key":"D","text":"Java"}],"answer":"B","status":"verified","knowledge":"软件来源","commands":"","detail":"AutoCAD 是 Autodesk 公司的计算机辅助设计软件。Adobe 以图形图像软件为主，Microsoft 是操作系统与办公软件厂商，Java 是编程平台而不是公司产品名。","doubt":"","bank":"本题考查 AutoCAD 基础操作或概念辨析。题库给出的正确选项为 B（Autodesk）。理解时应把题干中的操作目标与选项所描述的命令/参数对应起来，并注意相近命令之间的区别。"},{"id":4,"type":"single","stem":"画一水平为100的直线段，起点坐标为(0.0)，终点坐标为______","options":[{"key":"A","text":"@100，0"},{"key":"B","text":"@100,100"},{"key":"C","text":"@0,100"},{"key":"D","text":"@0,0"}],"answer":"A","status":"verified","knowledge":"相对直角坐标","commands":"LINE","detail":"水平向右长度 100，表示 X 增加 100、Y 不变。相对坐标加 @，所以终点是 @100,0。@100,100 是 45° 方向，@0,100 是竖直向上，@0,0 长度为 0。","doubt":"","bank":"本题考查“水平”相关知识。水平线段的两个端点纵坐标相同；相对直角坐标写作 @Δx,Δy，因此水平向右长度100可写为 @100,0。 题库给出的答案为 A（@100，0）。"},{"id":5,"type":"single","stem":"AutoCAD中文件保存时，文件的扩展名为_____","options":[{"key":"A","text":"dll"},{"key":"B","text":"dwg"},{"key":"C","text":"ac$"},{"key":"D","text":"dwt"}],"answer":"B","status":"verified","knowledge":"图形文件格式","commands":"SAVE","detail":"AutoCAD 图形文件的常用扩展名是 dwg。dwt 是样板文件，dll 是程序库，ac$ 是临时/自动保存类文件，都不是正常保存后的图形扩展名。","doubt":"","bank":"本题考查 AutoCAD 基础操作或概念辨析。题库给出的正确选项为 B（dwg）。理解时应把题干中的操作目标与选项所描述的命令/参数对应起来，并注意相近命令之间的区别。"},{"id":6,"type":"single","stem":"下列编辑工具中，能实现“改变位置”的功能的是______","options":[{"key":"A","text":"移动"},{"key":"B","text":"修剪"},{"key":"C","text":"比例缩放"},{"key":"D","text":"拉长"}],"answer":"A","status":"verified","knowledge":"移动命令","commands":"MOVE","detail":"MOVE（移动）只改变对象位置，不改变形状和大小。修剪改变边界，比例缩放改变大小，拉长改变长度或圆弧包角，都不以“改变位置”为主要结果。","doubt":"","bank":"本题考查 AutoCAD 基础操作或概念辨析。题库给出的正确选项为 A（移动）。理解时应把题干中的操作目标与选项所描述的命令/参数对应起来，并注意相近命令之间的区别。"},{"id":7,"type":"single","stem":"以下说法正确的是______","options":[{"key":"A","text":"矩形可以分解，同样圆也可以分解 。"},{"key":"B","text":"偏移命令不能偏移闭合的对象。"},{"key":"C","text":"图层锁定后，用户只能观察该层上的图形，不能对其编辑和修改，图形也不能显示和输出"},{"key":"D","text":"F5可以在绘制轴测时进行不同面的切换"}],"answer":"D","status":"verified","knowledge":"功能键与图层","commands":"EXPLODE / OFFSET","detail":"F5 在等轴测捕捉打开时，可在左、上、右三个等轴测平面之间切换，D 正确。圆不能用 EXPLODE 分解成弧，A 错。OFFSET 可以偏移闭合对象，B 错。图层锁定后图形仍显示，只是不能编辑，C 把锁定说成不能显示，也错。","doubt":"","bank":"本题考查 AutoCAD 基础操作或概念辨析。题库给出的正确选项为 D（F5可以在绘制轴测时进行不同面的切换）。理解时应把题干中的操作目标与选项所描述的命令/参数对应起来，并注意相近命令之间的区别。"},{"id":8,"type":"single","stem":"矩形命令运行后，命令行提示信息中提示画倒角矩形的选项是______","options":[{"key":"A","text":"C"},{"key":"B","text":"F"},{"key":"C","text":"E"},{"key":"D","text":"T"}],"answer":"A","status":"verified","knowledge":"矩形倒角选项","commands":"RECTANG","detail":"矩形命令中 Chamfer（倒角）的选项字母是 C，用来设置两个倒角距离。F 常表示圆角 Fillet，E 常表示标高 Elevation，T 不是倒角选项。","doubt":"","bank":"本题考查“倒角”相关知识。矩形命令的倒角选项用于设置角部两条倒角边的距离；常见命令行选项缩写为 C。 题库给出的答案为 A（C）。"},{"id":9,"type":"single","stem":"_____命令用于等分一个选定的对象，并在等分点处设置点标记符号或图块。用户输入的数值是等分段数，而不是设置点的个数。","options":[{"key":"A","text":"单点"},{"key":"B","text":"多点"},{"key":"C","text":"定数等分"},{"key":"D","text":"定距等分"}],"answer":"C","status":"verified","knowledge":"定数等分","commands":"DIVIDE","detail":"定数等分（DIVIDE）按“分成几段”放置点或块，输入的是段数，不是点的个数。定距等分按间距放置。单点、多点只是画点，并不等分对象。","doubt":"","bank":"本题考查 AutoCAD 基础操作或概念辨析。题库给出的正确选项为 C（定数等分）。理解时应把题干中的操作目标与选项所描述的命令/参数对应起来，并注意相近命令之间的区别。"},{"id":10,"type":"single","stem":"以下哪个不是矩形阵列中的设置______","options":[{"key":"A","text":"行偏移量"},{"key":"B","text":"阵列角度"},{"key":"C","text":"项目总数"},{"key":"D","text":"列偏移量"}],"answer":"C","status":"verified","knowledge":"矩形阵列参数","commands":"ARRAY","detail":"经典矩形阵列要指定行数、列数、行偏移、列偏移和阵列角度。“项目总数”是环形阵列用来定个数的参数，不是矩形阵列的设置项，所以选 C。","doubt":"","bank":"本题考查“矩形阵列”相关知识。矩形阵列的行偏移是相邻行基准位置之间的距离。圆半径为20且相邻圆相切时，圆心距为两个半径之和，即40；具体偏移方向由阵列设置决定。 题库给出的答案为 C（项目总数）。"},{"id":11,"type":"single","stem":"使用偏移复制的命令可以将已有对象进行平行复制或______复制","options":[{"key":"A","text":"同心"},{"key":"B","text":"旋转"},{"key":"C","text":"同方向"},{"key":"D","text":"对称"}],"answer":"A","status":"verified","knowledge":"偏移复制","commands":"OFFSET","detail":"OFFSET 对直线产生平行副本，对圆、圆弧产生同心副本。它不是旋转、对称或单纯同向复制。","doubt":"","bank":"本题考查“偏移”相关知识。OFFSET（偏移）按指定距离或通过指定点，生成与原对象平行、同心或等距的副本；直线偏移后平行，圆偏移后形成同心圆。 题库给出的答案为 A（同心）。"},{"id":12,"type":"single","stem":"已知一个等边三角形，现画一个与三边相切的圆可用下列______方法","options":[{"key":"A","text":"2P"},{"key":"B","text":"同心、半径"},{"key":"C","text":"相切、相切、半径"},{"key":"D","text":"相切、相切、相切"}],"answer":"D","status":"verified","knowledge":"三切点画圆","commands":"CIRCLE","detail":"与三角形三边都相切的圆，要用“相切、相切、相切”。2P 只由两点定直径；同心半径需要已有圆心；相切、相切、半径还要另外给半径，不能单靠三边确定。","doubt":"","bank":"本题考查“相切”相关知识。相切关系表示两个几何对象在接触处具有共同切线。三边相切圆可用三切线（Tangent-Tangent-Tangent）方式确定。 题库给出的答案为 D（相切、相切、相切）。"},{"id":14,"type":"single","stem":"画两个半径相同的相切圆，第一个圆心为(10.10)，半径为10，第二个圆心为_____","options":[{"key":"A","text":"(0.20)"},{"key":"B","text":"@10,0"},{"key":"C","text":"@20,10"},{"key":"D","text":"@20<90"}],"answer":"D","status":"verified","knowledge":"等半径外切","commands":"CIRCLE","detail":"两圆半径都是 10 且外切时，圆心距为 20。相对极坐标 @20<90 表示从第一圆心竖直向上 20，刚好外切。@10,0 距离只有 10，会相交；@20,10 距离不是 20。题库坐标写成 (10.10)，按逗号理解即 (10,10)。","doubt":"","bank":"本题考查“相切”相关知识。相切关系表示两个几何对象在接触处具有共同切线。三边相切圆可用三切线（Tangent-Tangent-Tangent）方式确定。 题库给出的答案为 D（@20<90）。"},{"id":15,"type":"single","stem":"设置图形界限的命令是_____","options":[{"key":"A","text":"unit"},{"key":"B","text":"Limittse"},{"key":"C","text":"Limits"},{"key":"D","text":"nits"}],"answer":"C","status":"verified","knowledge":"图形界限","commands":"LIMITS","detail":"设置图形界限的命令是 LIMITS。UNITS 设置单位和精度。Limittse、nits 不是有效命令。","doubt":"","bank":"本题考查 AutoCAD 基础操作或概念辨析。题库给出的正确选项为 C（Limits）。理解时应把题干中的操作目标与选项所描述的命令/参数对应起来，并注意相近命令之间的区别。"},{"id":16,"type":"single","stem":"颜色有助于区分图形中相似的元系，______可以区分不同的绘图元素","options":[{"key":"A","text":"线宽"},{"key":"B","text":"线型"},{"key":"C","text":"灯泡"},{"key":"D","text":"打印方式"}],"answer":"B","status":"verified","knowledge":"线型","commands":"LINETYPE","detail":"题干已经说颜色能区分相似元素，接着问另一种区分手段。线型（实线、虚线、点划线）用来区分不同绘图元素。线宽表示粗细，打印方式控制输出，灯泡只是图层开关图标。","doubt":"","bank":"本题考查 AutoCAD 基础操作或概念辨析。题库给出的正确选项为 B（线型）。理解时应把题干中的操作目标与选项所描述的命令/参数对应起来，并注意相近命令之间的区别。"},{"id":17,"type":"single","stem":"对长度为100的线段定距等分，定距为20，则有______个点","options":[{"key":"A","text":"4"},{"key":"B","text":"5"},{"key":"C","text":"6"},{"key":"D","text":"7"}],"answer":"B","status":"verified","knowledge":"定距等分点数","commands":"MEASURE","detail":"线段长 100、间距 20，100÷20=5，正好整除。MEASURE 从选定端沿对象按间距放点，整除时末端也落在分点上，共 5 个点。题库按 5 计分。","doubt":"","bank":"本题考查“定距等分”相关知识。MEASURE（定距等分）按指定间距沿对象布置点或图块。题目所问点数要结合长度、间距及端点是否计入判断。 题库给出的答案为 B（5）。"},{"id":18,"type":"single","stem":"构造线命令(XL)运行后有(V)、(H)、(A)、(B)四个选项，表示按指定角度画线的是_____","options":[{"key":"A","text":"A"},{"key":"B","text":"H"},{"key":"C","text":"V"},{"key":"D","text":"B"}],"answer":"A","status":"verified","knowledge":"构造线角度","commands":"XLINE","detail":"构造线命令别名 XL。提示中 H 是水平，V 是垂直，A 是 Angle（指定角度），B 是角平分。按指定角度画线选 A。","doubt":"","bank":"本题考查“构造线”相关知识。XLINE（构造线）是沿指定方向无限延伸的辅助线；选项 A 通常表示指定角度（Angle）。 题库给出的答案为 A（A）。"},{"id":19,"type":"single","stem":"要在绘图区画出五角星，一般先画_____","options":[{"key":"A","text":"点"},{"key":"B","text":"直线"},{"key":"C","text":"三角形"},{"key":"D","text":"正五边形"}],"answer":"D","status":"verified","knowledge":"五角星画法","commands":"POLYGON","detail":"正五角星通常先画正五边形，再把顶点隔一个相连。先画点、直线或三角形都不是常规构造步骤。","doubt":"","bank":"本题考查“五角星”相关知识。规则五角星通常可由正五边形的顶点按间隔连接形成，因此先绘制正五边形是常见构造方法。 题库给出的答案为 D（正五边形）。"},{"id":20,"type":"single","stem":"创建一个圆与已知圆同心，可以使用哪个修改命令","options":[{"key":"A","text":"阵列"},{"key":"B","text":"复制"},{"key":"C","text":"镜像"},{"key":"D","text":"偏移"}],"answer":"D","status":"verified","knowledge":"同心圆","commands":"OFFSET","detail":"对已知圆使用偏移，得到半径不同、圆心相同的圆。阵列、复制、镜像不能保证新圆与原圆同心，除非再配合捕捉，题目问的是直接可用的修改命令。","doubt":"","bank":"本题考查 AutoCAD 基础操作或概念辨析。题库给出的正确选项为 D（偏移）。理解时应把题干中的操作目标与选项所描述的命令/参数对应起来，并注意相近命令之间的区别。"},{"id":21,"type":"single","stem":"环形阵列一个圆，填充角度为270，项目间角度为30，则项目总数为____","options":[{"key":"A","text":"8"},{"key":"B","text":"9"},{"key":"C","text":"10"},{"key":"D","text":"12"}],"answer":"C","status":"verified","knowledge":"环形阵列个数","commands":"ARRAY","detail":"填充角 270°、项目间夹角 30° 时，间隔数是 270/30=9。包含起始项，项目总数为 9+1=10。","doubt":"","bank":"本题考查“阵列”相关知识。阵列用于按规则复制对象。矩形阵列通常设置行数、列数、行/列偏移和阵列角度；环形阵列围绕中心点按角度分布项目。 题库给出的答案为 C（10）。"},{"id":22,"type":"single","stem":"对齐标注可以创造平行于所选对象直线型尺寸，主要用于标注______方向的尺寸","options":[{"key":"A","text":"水平"},{"key":"B","text":"倾斜"},{"key":"C","text":"垂直"},{"key":"D","text":"非倾斜"}],"answer":"B","status":"verified","knowledge":"对齐标注","commands":"DIMALIGNED","detail":"对齐标注的尺寸线平行于所选两点连线，专门用来标倾斜方向的尺寸。水平和垂直由线性标注完成。","doubt":"","bank":"本题考查“线型”相关知识。线型用于区分不同绘图元素，例如实线、虚线、点划线；线宽控制线条粗细，颜色用于视觉区分。 题库给出的答案为 B（倾斜）。"},{"id":23,"type":"single","stem":"以下哪个不是矩形命令中的选项_____","options":[{"key":"A","text":"倒角"},{"key":"B","text":"半径"},{"key":"C","text":"标高"},{"key":"D","text":"厚度"}],"answer":"B","status":"verified","knowledge":"矩形命令选项","commands":"RECTANG","detail":"矩形命令常见选项有倒角、标高、圆角、厚度、宽度。没有名叫“半径”的选项；圆角用的是圆角半径，但选项名不是“半径”。故“不是选项”的是半径。","doubt":"","bank":"本题考查“矩形”相关知识。RECTANG（矩形）可通过角点绘制矩形，并提供倒角、标高、圆角、厚度、宽度等选项（选项随版本/命令提示而异）。 题库给出的答案为 B（半径）。"},{"id":24,"type":"single","stem":"下列对面域说法正确的是_____","options":[{"key":"A","text":"面域对象的命令是rev"},{"key":"B","text":"面域对象必须是一个闭合的对象"},{"key":"C","text":"面域对象可是一个不闭合的对象"},{"key":"D","text":"面域后的对象不能直接进行布尔运算"}],"answer":"B","status":"verified","knowledge":"面域","commands":"REGION","detail":"面域必须由闭合边界生成，命令是 REGION 而不是 rev。闭合面域才能做并、差、交等布尔运算。不闭合对象不能直接成面域。","doubt":"","bank":"本题考查“面域”相关知识。REGION（面域）将闭合的二维边界转换为面域对象。面域可用于面积计算及布尔运算；边界必须闭合或能够构成闭合区域。 题库给出的答案为 B（面域对象必须是一个闭合的对象）。"},{"id":25,"type":"single","stem":"圆心(10.10)，R=10的圆与圆心(10.10)，R=20的圆关系是_____","options":[{"key":"A","text":"相交"},{"key":"B","text":"相切"},{"key":"C","text":"同心圆"},{"key":"D","text":"相离"}],"answer":"C","status":"verified","knowledge":"同心圆判定","commands":"","detail":"两圆圆心都是 (10,10)，只是半径 10 和 20 不同，属于同心圆。圆心相同就不会相交、相切或相离。","doubt":"","bank":"本题考查 AutoCAD 基础操作或概念辨析。题库给出的正确选项为 C（同心圆）。理解时应把题干中的操作目标与选项所描述的命令/参数对应起来，并注意相近命令之间的区别。"},{"id":26,"type":"single","stem":"执行复制命令操作过程中，必须指定____","options":[{"key":"A","text":"复制命令"},{"key":"B","text":"基点"},{"key":"C","text":"位移"},{"key":"D","text":"光标定位"}],"answer":"B","status":"verified","knowledge":"复制基点","commands":"COPY","detail":"执行 COPY 时必须先指定基点，再用第二点或位移确定副本位置。位移可以代替第二点，但基点是过程中不能省略的指定。","doubt":"","bank":"本题考查“复制”相关知识。COPY（复制）需要指定基点，再指定第二点/位移来确定副本位置；复制通常保留原对象。 题库给出的答案为 B（基点）。"},{"id":27,"type":"single","stem":"一个完整的尺寸标注由尺寸线、延伸线、尺寸箭头、______4个部分组成","options":[{"key":"A","text":"线宽"},{"key":"B","text":"线型"},{"key":"C","text":"颜色"},{"key":"D","text":"标注文字"}],"answer":"D","status":"verified","knowledge":"尺寸四要素","commands":"DIMLINEAR","detail":"一个完整尺寸由尺寸线、延伸线（尺寸界线）、尺寸箭头和标注文字组成。线宽、线型、颜色是外观特性，不是尺寸的四个组成部分。","doubt":"","bank":"本题考查“尺寸标注”相关知识。完整尺寸标注通常由尺寸线、尺寸界线（延伸线）、箭头和尺寸文字组成。 题库给出的答案为 D（标注文字）。"},{"id":28,"type":"single","stem":"UCS属于什么坐标系______","options":[{"key":"A","text":"世界坐标系"},{"key":"B","text":"用户坐标系"},{"key":"C","text":"自定义坐标系"},{"key":"D","text":"单一固定的坐标系"}],"answer":"B","status":"verified","knowledge":"用户坐标系","commands":"UCS","detail":"UCS 是 User Coordinate System，用户坐标系，原点和轴向可由用户改变。世界坐标系是 WCS。它不是单一固定坐标系。","doubt":"","bank":"本题考查“UCS”相关知识。UCS 是用户坐标系（User Coordinate System），可由用户调整原点和坐标轴方向；WCS 是世界坐标系。 题库给出的答案为 B（用户坐标系）。"},{"id":29,"type":"single","stem":"画一边长为100的等边三角形，起点坐标为(0.0)，第二点为(100.0)，则第三点为______","options":[{"key":"A","text":"@-100.50"},{"key":"B","text":"@100<90"},{"key":"C","text":"@100<45"},{"key":"D","text":"@100<135"}],"answer":"D","status":"verified","knowledge":"等边三角形极坐标","commands":"LINE","detail":"底边从 (0,0) 到 (100,0)。第三点相对第二点，应沿 120° 方向返回，相对第一点常用 @100<60；若相对第二点 (100,0)，内角方向是 @100<120。题库给出的选项是 @100<135，评分以 D 为准。补充：按标准几何，第三点相对第二点更准确的是 @100<120，135° 并不是等边三角形的内角，本题答案存在教材口径差异，作答仍选 D。","doubt":"","bank":"本题考查“坐标”相关知识。绝对直角坐标以坐标原点为基准；相对直角坐标以前一点为基准并使用 @；相对极坐标用 @距离<角度。 题库给出的答案为 D（@100<135）。"},{"id":30,"type":"single","stem":"对象捕捉主要是针对对象的，而捕捉主要是针对______的，用于控制栅格的间隔捕捉","options":[{"key":"A","text":"对象"},{"key":"B","text":"栅格"},{"key":"C","text":"直线"},{"key":"D","text":"构造线"}],"answer":"B","status":"verified","knowledge":"栅格捕捉","commands":"SNAP / OSNAP","detail":"对象捕捉针对图形对象上的特征点。捕捉（SNAP）针对栅格间距，让光标按设定间隔跳动。题干后半句已经说明“用于控制栅格的间隔捕捉”。","doubt":"","bank":"本题考查“对象捕捉”相关知识。对象捕捉用于精确捕捉几何对象特征点，如端点、中点、圆心、交点、节点等；栅格捕捉则按设定间距吸附光标。 题库给出的答案为 B（栅格）。"},{"id":31,"type":"single","stem":"对半径为10的圆定数等分五份，会出现______个点","options":[{"key":"A","text":"4"},{"key":"B","text":"5"},{"key":"C","text":"6"},{"key":"D","text":"7"}],"answer":"B","status":"verified","knowledge":"圆的定数等分","commands":"DIVIDE","detail":"闭合的圆被定数等分成 5 段时，分点数等于段数，出现 5 个点。不会因为闭合就少一个点。","doubt":"","bank":"本题考查“定数等分”相关知识。DIVIDE（定数等分）按输入的段数将对象等分，并在等分位置放置点或指定图块。输入的是段数，点的数量通常与段数相同。 题库给出的答案为 B（5）。"},{"id":32,"type":"single","stem":"镜像命令是将用户指定的对象按指定的______进行复制","options":[{"key":"A","text":"基点"},{"key":"B","text":"对称轴"},{"key":"C","text":"位移"},{"key":"D","text":"对称点"}],"answer":"B","status":"verified","knowledge":"镜像轴","commands":"MIRROR","detail":"镜像是按指定对称轴复制出对称图形。基点、位移是复制或移动的概念，对称点不是镜像命令要求指定的对象。","doubt":"","bank":"本题考查“复制”相关知识。COPY（复制）需要指定基点，再指定第二点/位移来确定副本位置；复制通常保留原对象。 题库给出的答案为 B（对称轴）。"},{"id":33,"type":"single","stem":"圆心(0.10)，半径10的圆，与圆心为(0.10)，半径30的圆之间的关系是_____","options":[{"key":"A","text":"相交"},{"key":"B","text":"相切"},{"key":"C","text":"相离"},{"key":"D","text":"同心圆"}],"answer":"D","status":"verified","knowledge":"同心圆","commands":"","detail":"两个圆的圆心都是 (0,10)，半径分别为 10 和 30，圆心重合，关系是同心圆。","doubt":"","bank":"本题考查 AutoCAD 基础操作或概念辨析。题库给出的正确选项为 D（同心圆）。理解时应把题干中的操作目标与选项所描述的命令/参数对应起来，并注意相近命令之间的区别。"},{"id":34,"type":"single","stem":"F9的功能是什么","options":[{"key":"A","text":"打开/关闭栅格捕捉状态"},{"key":"B","text":"打开/关闭对象捕捉状态"},{"key":"C","text":"打开/关闭栅格显示状态"},{"key":"D","text":"打开/关闭正交状态"}],"answer":"A","status":"verified","knowledge":"F9 栅格捕捉","commands":"SNAP","detail":"F9 开关栅格捕捉（Snap）。F3 是对象捕捉，F7 是栅格显示，F8 是正交。不要和 F7 的栅格显示混淆。","doubt":"","bank":"本题考查“F9”相关知识。F9 用于打开或关闭栅格捕捉（Snap）状态；F7 通常控制栅格显示，F8 控制正交，F3 控制对象捕捉。 题库给出的答案为 A（打开/关闭栅格捕捉状态）。"},{"id":35,"type":"single","stem":"定数等分点用什么命令","options":[{"key":"A","text":"MEASURE"},{"key":"B","text":"DIVIDE"},{"key":"C","text":"DIST"},{"key":"D","text":"LIS"}],"answer":"B","status":"verified","knowledge":"定数等分命令","commands":"DIVIDE","detail":"定数等分的命令是 DIVIDE。MEASURE 是定距等分，DIST 量距离，LIST 查询对象信息。","doubt":"","bank":"本题考查“定数等分”相关知识。DIVIDE（定数等分）按输入的段数将对象等分，并在等分位置放置点或指定图块。输入的是段数，点的数量通常与段数相同。 题库给出的答案为 B（DIVIDE）。"},{"id":36,"type":"single","stem":"EL是什么命令","options":[{"key":"A","text":"椭圆弧"},{"key":"B","text":"椭圆"},{"key":"C","text":"半圆"},{"key":"D","text":"圆"}],"answer":"B","status":"verified","knowledge":"椭圆别名","commands":"ELLIPSE","detail":"EL 是 ELLIPSE（椭圆）的命令别名。椭圆弧也在椭圆命令里用 Arc 选项绘制，但 EL 本身表示椭圆命令。","doubt":"","bank":"本题考查“EL”相关知识。EL 是 ELLIPSE（椭圆）命令的常见缩写，用于绘制椭圆。 题库给出的答案为 B（椭圆）。"},{"id":37,"type":"single","stem":"修剪的快捷键是","options":[{"key":"A","text":"BT"},{"key":"B","text":"CT"},{"key":"C","text":"TE"},{"key":"D","text":"TR"}],"answer":"D","status":"verified","knowledge":"修剪别名","commands":"TRIM","detail":"修剪命令 TRIM 的常用别名是 TR。","doubt":"","bank":"本题考查“修剪”相关知识。TRIM（修剪）根据选定的边界剪去对象多余部分；常见快捷命令为 TR。 题库给出的答案为 D（TR）。"},{"id":38,"type":"single","stem":"在CAD中，以下哪个命令可以用来绘制横平竖直的直线","options":[{"key":"A","text":"栅格"},{"key":"B","text":"捕捉"},{"key":"C","text":"正交"},{"key":"D","text":"对象捕捉"}],"answer":"C","status":"verified","knowledge":"正交模式","commands":"ORTHO","detail":"正交模式把光标限制在水平或垂直方向，用来画横平竖直的直线。栅格和捕捉控制间距，对象捕捉抓特征点，它们本身不强制正交。","doubt":"","bank":"本题考查 AutoCAD 基础操作或概念辨析。题库给出的正确选项为 C（正交）。理解时应把题干中的操作目标与选项所描述的命令/参数对应起来，并注意相近命令之间的区别。"},{"id":39,"type":"single","stem":"在CAD中为一条直线制作平行线用什么命令","options":[{"key":"A","text":"移动"},{"key":"B","text":"镜像"},{"key":"C","text":"偏移"},{"key":"D","text":"旋转"}],"answer":"C","status":"verified","knowledge":"平行线","commands":"OFFSET","detail":"给一条直线做等距平行线，用偏移 OFFSET。移动不产生新线，镜像产生对称线，旋转改变方向。","doubt":"","bank":"本题考查 AutoCAD 基础操作或概念辨析。题库给出的正确选项为 C（偏移）。理解时应把题干中的操作目标与选项所描述的命令/参数对应起来，并注意相近命令之间的区别。"},{"id":40,"type":"single","stem":"按哪个键可以切换文本窗口和绘图","options":[{"key":"A","text":"F2"},{"key":"B","text":"F8"},{"key":"C","text":"F3"},{"key":"D","text":"F5"}],"answer":"A","status":"verified","knowledge":"文本窗口","commands":"TEXTSCR","detail":"F2 在图形窗口和文本窗口之间切换。F8 正交，F3 对象捕捉，F5 等轴测平面。","doubt":"","bank":"本题考查“文本”相关知识。单行文字与多行文字都创建文字对象，但对象类型、编辑方式和排版能力不同，不能简单视为本质完全相同。 题库给出的答案为 A（F2）。"},{"id":41,"type":"single","stem":"复制快捷键是","options":[{"key":"A","text":"CO"},{"key":"B","text":"O"},{"key":"C","text":"X"},{"key":"D","text":"EX"}],"answer":"A","status":"verified","knowledge":"复制别名","commands":"COPY","detail":"复制命令 COPY 的常用别名是 CO（也可用 CP）。O 是偏移，X 是分解，EX 常作延伸 EXTEND。","doubt":"","bank":"本题考查“复制”相关知识。COPY（复制）需要指定基点，再指定第二点/位移来确定副本位置；复制通常保留原对象。 题库给出的答案为 A（CO）。"},{"id":42,"type":"single","stem":"下面的各个选项都可以绘制圆弧，除了哪一个不行","options":[{"key":"A","text":"起点、圆心、终点"},{"key":"B","text":"起点、圆心、方向"},{"key":"C","text":"圆心、起点、长度"},{"key":"D","text":"起点、终点、半径"}],"answer":"B","status":"verified","knowledge":"圆弧画法","commands":"ARC","detail":"圆弧可以按起点圆心终点、圆心起点长度、起点终点半径等方式绘制。标准选项里没有“起点、圆心、方向”；方向是和起点、终点配合的。所以不能用的是 B。","doubt":"","bank":"本题考查 AutoCAD 基础操作或概念辨析。题库给出的正确选项为 B（起点、圆心、方向）。理解时应把题干中的操作目标与选项所描述的命令/参数对应起来，并注意相近命令之间的区别。"},{"id":43,"type":"single","stem":"画完一幅图后，在保存该图形为模板文件时用_______作为扩展名。","options":[{"key":"A","text":"CFG"},{"key":"B","text":"DWT"},{"key":"C","text":"BMP"},{"key":"D","text":"DWG"}],"answer":"B","status":"verified","knowledge":"样板文件","commands":"SAVEAS","detail":"图形样板的扩展名是 DWT。DWG 是图形，BMP 是图像，CFG 不是 AutoCAD 样板。","doubt":"","bank":"本题考查 AutoCAD 基础操作或概念辨析。题库给出的正确选项为 B（DWT）。理解时应把题干中的操作目标与选项所描述的命令/参数对应起来，并注意相近命令之间的区别。"},{"id":44,"type":"single","stem":"某种图层上的图形不能编辑，也不可见这种图层是：","options":[{"key":"A","text":"冻结的"},{"key":"B","text":"关闭的"},{"key":"C","text":"锁定的"},{"key":"D","text":"解锁的"}],"answer":"B","status":"verified","knowledge":"关闭图层","commands":"LAYER","detail":"题库认为“不能编辑也不可见”对应关闭的图层。冻结的图层同样不可见；锁定的图层可见但不能编辑。按题库选项，答案是关闭的。补充：冻结层也不可见、不可编辑，区别主要是冻结层不参与重生成。评分仍选 B。","doubt":"","bank":"本题考查“图层”相关知识。LAYER 用于创建、设置和管理图层，包括名称、颜色、线型、线宽、开/关、冻结和锁定等属性。 题库给出的答案为 B（关闭的）。"},{"id":45,"type":"single","stem":"使用______命令来创建文字样式","options":[{"key":"A","text":"MT"},{"key":"B","text":"STYLE"},{"key":"C","text":"TS"},{"key":"D","text":"TEXT"}],"answer":"B","status":"verified","knowledge":"文字样式","commands":"STYLE","detail":"创建文字样式用 STYLE。MT 是多行文字，TEXT 是单行文字，它们使用样式而不是创建样式。","doubt":"","bank":"本题考查 AutoCAD 基础操作或概念辨析。题库给出的正确选项为 B（STYLE）。理解时应把题干中的操作目标与选项所描述的命令/参数对应起来，并注意相近命令之间的区别。"},{"id":46,"type":"single","stem":"“C”是______命令的别名","options":[{"key":"A","text":"COPY"},{"key":"B","text":"CHAMFER"},{"key":"C","text":"SCALE"},{"key":"D","text":"CIRCLE"}],"answer":"D","status":"verified","knowledge":"圆的别名","commands":"CIRCLE","detail":"命令别名 C 代表 CIRCLE（圆）。COPY 是 CO/CP，CHAMFER 是 CHA，SCALE 是 SC。","doubt":"","bank":"本题考查 AutoCAD 基础操作或概念辨析。题库给出的正确选项为 D（CIRCLE）。理解时应把题干中的操作目标与选项所描述的命令/参数对应起来，并注意相近命令之间的区别。"},{"id":47,"type":"single","stem":"既可以绘制直线，又可以绘制曲线的命令是____","options":[{"key":"A","text":"样条曲线"},{"key":"B","text":"多线"},{"key":"C","text":"多段线"},{"key":"D","text":"构造线"}],"answer":"C","status":"verified","knowledge":"多段线","commands":"PLINE","detail":"多段线可以连续画出直线段和圆弧段。样条曲线和构造线不能同时按这个方式画直线加圆弧，多线是一组平行线。","doubt":"","bank":"本题考查 AutoCAD 基础操作或概念辨析。题库给出的正确选项为 C（多段线）。理解时应把题干中的操作目标与选项所描述的命令/参数对应起来，并注意相近命令之间的区别。"},{"id":48,"type":"single","stem":"环形阵列定义阵列对象数目和分布方法的不正确方法是____","options":[{"key":"A","text":"项目总数和填充角度"},{"key":"B","text":"项目总数和项目间的角度"},{"key":"C","text":"项目总数和基点位置"},{"key":"D","text":"填充角度和项目间"}],"answer":"C","status":"verified","knowledge":"环形阵列参数","commands":"ARRAY","detail":"环形阵列可用“项目总数+填充角度”“项目总数+项目间角度”或“填充角度+项目间角度”来确定分布。只给项目总数和基点位置，没有角度，无法确定怎么分布，所以这是不正确方法。","doubt":"","bank":"本题考查“阵列”相关知识。阵列用于按规则复制对象。矩形阵列通常设置行数、列数、行/列偏移和阵列角度；环形阵列围绕中心点按角度分布项目。 题库给出的答案为 C（项目总数和基点位置）。"},{"id":49,"type":"single","stem":"移动圆对象，使其圆心移动到直线中点，需要应用：","options":[{"key":"A","text":"正交"},{"key":"B","text":"捕捉"},{"key":"C","text":"栅格"},{"key":"D","text":"对象捕捉"}],"answer":"D","status":"verified","knowledge":"对象捕捉中点","commands":"MOVE / OSNAP","detail":"要把圆心精确放到直线中点，需要对象捕捉（圆心和中点）。正交、栅格、栅格捕捉都不能识别直线中点。","doubt":"","bank":"本题考查“移动”相关知识。MOVE（移动）改变对象的位置，不改变对象的形状和大小；修剪改变边界，缩放改变大小，拉长改变长度或圆弧参数。 题库给出的答案为 D（对象捕捉）。"},{"id":50,"type":"single","stem":"如何复制一个图像","options":[{"key":"A","text":"“ 修改-复制“"},{"key":"B","text":"”绘制-复制“"},{"key":"C","text":"“ 工具-复制“"},{"key":"D","text":"“编辑-复制”"}],"answer":"A","status":"verified","knowledge":"复制入口","commands":"COPY","detail":"在图形里复制对象，走“修改 → 复制”（COPY）。绘制菜单没有复制，工具菜单也不是这个命令。编辑菜单的复制多指剪贴板，题库指定的是修改菜单。","doubt":"","bank":"本题考查“复制”相关知识。COPY（复制）需要指定基点，再指定第二点/位移来确定副本位置；复制通常保留原对象。 题库给出的答案为 A（“ 修改-复制“）。"},{"id":51,"type":"single","stem":"打开、关闭正交的是下列哪个符号标志","options":[{"key":"A","text":"F2"},{"key":"B","text":"F4"},{"key":"C","text":"F6"},{"key":"D","text":"F8"}],"answer":"D","status":"verified","knowledge":"F8 正交","commands":"ORTHO","detail":"打开或关闭正交的功能键是 F8。F2 是文本窗口。","doubt":"","bank":"本题考查“正交”相关知识。正交模式限制光标沿水平或垂直方向移动，常用于绘制横平竖直的线段，通常由 F8 切换。 题库给出的答案为 D（F8）。"},{"id":52,"type":"single","stem":"下列哪一个不是命令的调用方式","options":[{"key":"A","text":"菜单栏"},{"key":"B","text":"工具栏"},{"key":"C","text":"Enter键"},{"key":"D","t  相切、相切、相切 和 相切、相切、半径 命令。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"A","status":"verified","knowledge":"画圆方法","commands":"CIRCLE","detail":"圆的方法包括两点、三点、相切相切相切和相切相切半径。陈述正确。圆心半径是更基本的一种，题干没有把它写全，但题库仍判正确。","doubt":"","bank":"本题考查“相切”相关知识。相切关系表示两个几何对象在接触处具有共同切线。三边相切圆可用三切线（Tangent-Tangent-Tangent）方式确定。 题库给出的答案为 A（正确）。"},{"id":179,"type":"judge","stem":"构造线主要用于 辅助作用","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"A","status":"verified","knowledge":"构造线作用","commands":"XLINE","detail":"构造线主要用于辅助作图。陈述正确。","doubt":"","bank":"本题考查“构造线”相关知识。XLINE（构造线）是沿指定方向无限延伸的辅助线；选项 A 通常表示指定角度（Angle）。 题库给出的答案为 A（正确）。"},{"id":180,"type":"judge","stem":"定数等分的作用是 只能将直线对象等分为指定数目的相等长度","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"B","status":"verified","knowledge":"定数等分对象","commands":"DIVIDE","detail":"定数等分不只能等分直线，圆弧、圆、多段线、样条曲线也可以。说“只能将直线”是错误的。","doubt":"","bank":"本题考查“定数等分”相关知识。DIVIDE（定数等分）按输入的段数将对象等分，并在等分位置放置点或指定图块。输入的是段数，点的数量通常与段数相同。 题库给出的答案为 B（错误）。"},{"id":181,"type":"judge","stem":"使用 OOPS 命令，可以恢复使用“删除”命令删除的对象","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"A","status":"verified","knowledge":"OOPS","commands":"OOPS","detail":"OOPS 用来恢复最近一次 ERASE 删除的对象。陈述正确。","doubt":"","bank":"本题考查“OOPS”相关知识。OOPS 可恢复最近一次 ERASE 删除的对象；UNDO/U 也可撤销操作，但撤销范围取决于命令历史。 题库给出的答案为 A（正确）。"},{"id":182,"type":"judge","stem":"旋转对象时若需在原位置保留对象可使用其中的 复制（C） 命令。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"A","status":"verified","knowledge":"旋转复制","commands":"ROTATE","detail":"旋转时选择复制（C），会在旋转出新对象的同时保留原对象。陈述正确。","doubt":"","bank":"本题考查“复制”相关知识。COPY（复制）需要指定基点，再指定第二点/位移来确定副本位置；复制通常保留原对象。 题库给出的答案为 A（正确）。"},{"id":183,"type":"judge","stem":"在缩放对象时，当比例因子大于0而小于1时缩小对象，当比例因子大于1时放大对象。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"A","status":"verified","knowledge":"缩放比例","commands":"SCALE","detail":"比例因子大于 1 放大，大于 0 且小于 1 缩小。陈述正确。","doubt":"","bank":"本题考查“比例”相关知识。SCALE（缩放）以基点和比例因子改变对象大小；比例因子大于1 function practicePage(){if(!session){$('#main').innerHTML=`<div class="pagehead"><div><h2>题目练习</h2><div class="sub">选择练习方式，开始巩固知识点。</div></div></div><div class="card"><div class="grid quick-grid"><button class="quick" onclick="startPractice('sequential','all')"><span class="qic">📖</span><b>全部顺序练习</b><small>按题号从前往后练习</small></button><button class="quick" onclick="startPractice('random','all')"><span class="qic">🎲</span><b>全部随机练习</b><small>随机抽取题目</small></button><button class="quick" onclick="startPractice('category','single')"><span class="qic">A</span><b>单选题专项</b><small>83 道题</small></button><button class="quick" onclick="startPractice('category','multi')"><span class="qic">☑</span><b>多选题专项</b><small>50 道题</small></button><button class="quick" onclick="startPractice('category','judge')"><span class="qic">✓</span><b>判断题专项</b><small>63 道题</small></button><button class="quick" onclick="startPractice('random','all',Object.keys(state.wrong).filter(id=>state.wrong[id].count>0).map(Number))"><span class="qic">↻</span><b>错题强化</b><small>针对答错题目复习</small></button></div><div class="notice" style="margin-top:16px;margin-bottom:0">默认练习会排除争议题；可在模拟考试设置中调整该规则。也可在题目查询中直接打开任意题目。</div></div>`;return}
let q=currentQ();if(!q){session=null;practicePage();return}let p=session.picks||[];let checked=session.checked;let answer=answerKeys(q.answer);let isRight=correct(q,p);let status=q.status==='conflict'?'<span class="pill amber">答案待核验</span>':'<span class="pill green">常规题目</span>';
$('#main').innerHTML=`<div class="pagehead"><div><h2>题目练习</h2><div class="sub">${session.mode==='sequential'?'顺序练习':session.mode==='random'?'随机练习':'专项练习'} · 第 ${session.index+1} / ${session.ids.length} 题</div></div><button class="btn" onclick="session=null;render()">退出练习</button></div><div class="card question"><div class="progressline"><i style="width:${(session.index+1)/session.ids.length*100}%"></i></div><div class="qmeta"><span class="pill">${qtype(q.type)}</span><span>题号 ${q.id}</span>${status}<span>${q.knowledge||'基础知识'}</span></div><h3 class="qstem">${esc(q.stem)}</h3><div class="options">${q.options.map(o=>{let selected=p.includes(o.key),cls=checked?(answer.includes(o.key)?'correct':selected?'wrong':''):selected?'selected':'';return `<button class="option ${cls}" ${checked?'disabled':''} onclick="togglePick('${o.key}')"><span class="optkey">${o.key}</span><span class="opttext">${esc(o.text)}</span>${checked&&answer.includes(o.key)?'<b style="margin-left:auto;color:var(--green)">✓</b>':''}</button>`}).join('')}</div>${checked?`<div class="feedback"><h4 style="color:${isRight?'var(--green)':'var(--red)'}">${isRight?'回答正确':'回答错误'} · 正确答案：${answer.join('、')}</h4><p><b>知识点：</b>${esc(q.knowledge)}</p>${q.commands?`<p><b>相关命令：</b>${esc(q.commands)}</p>`:''}<p><b>答案解析：</b>${esc(q.detail||'暂无详细解析')}</p>${q.status==='conflict'?`<p style="color:var(--amber)"><b>争议说明：</b>${esc(q.doubt||'该题答案存在待核验情况，请结合教材复核。')}</p>`:''}<details class="explain"><summary>查看题库原始说明</summary><div class="explain-body">${esc(q.bank||'暂无原始说明')}</div></details></div>`:''}<div class="qactions"><div class="group"><button class="btn" onclick="toggleFavorite(${q.id})">${state.favorites.includes(q.id)?'★ 已收藏':'☆ 收藏'}</button><button class="btn" onclick="toggleDoubt(${q.id})">${state.doubts.includes(q.id)?'已标记疑难':'标记疑难'}</button></div><div class="group">${!checked?`<button class="btn primary" onclick="submitPractice()">提交答案</button>`:`<button class="btn" onclick="prevQ()" ${session.index===0?'disabled':''}>上一题</button><button class="btn primary" onclick="nextQ()">${session.index===session.ids.length-1?'完成练习':'下一题'}</button>`}</div></div></div>`}
function togglePick(k){if(!session||session.checked)return;let q=currentQ();if(q.type==='single'||q.type==='judge')session.picks=[k];else session.picks=session.picks.includes(k)?session.picks.filter(x=>x!==k):[...session.picks,k];practicePage()}
function submitPractice(){if(!session?.picks.length){toast('请先选择答案');return}let q=currentQ();session.checked=true;let r=correct(q,session.picks);if(!session.recorded){record(q,session.picks,r);session.recorded=true}practicePage()}
function nextQ(){if(session.index<session.ids.length-1){session.index++;session.checked=false;session.recorded=false;session.picks=[];practicePage()}else{session=null;toast('本轮练习完成');nav('home')}}function prevQ(){if(session.index>0){session.index--;session.checked=false;session.recorded=false;session.picks=picksFor(session.ids[session.index]);practicePage()}}
function toggleFavorite(id){state.favorites=state.favorites.includes(id)?state.favorites.filter(x=>x!==id):[...state.favorites,id];save();toast(state.favorites.includes(id)?'已加入收藏':'已取消收藏');render()}
function toggleDoubt(id){state.doubts=state.doubts.includes(id)?state.doubts.filter(x=>x!==id):[...state.doubts,id];save();toast('疑难标记已更新');render()}
function openQuestion(id){startPractice('sequential','all',[id])}
function listPage(title,ids,empty,kind){$('#main').innerHTML=`<div class="pagehead"><div><h2>${title}</h2><div class="sub">共 ${ids.length} 道题目</div></div></div>${ids.length?`<div class="list">${ids.map(id=>{let q=Q.find(x=>x.id===id),w=state.wrong[id];return `<div class="listitem"><span class="pill">${id}</span><div class="grow"><h4>${esc(q.stem)}</h4><p>${qtype(q.type)} · ${esc(q.knowledge||'')}</p></div>${kind==='wrong'?`<span class="pill red">错 ${w?.count||0} 次</span>`:''}<button class="btn soft" onclick="openQuestion(${id})">练习</button>${kind==='wrong'?`<button class="btn" onclick="setMastery(${id})">${w?.mastery==='mastered'?'已掌握':'标记掌握'}</button>`:''}</div>`}).join('')}</div>`:`<div class="card empty">${empty}</div>`}`}
function wrongPage(){let ids=Object.keys(state.wrong).filter(id=>state.wrong[id].count>0&&state.wrong[id].mastery!=='mastered').map(Number).sort((a,b)=>a-b);listPage('错题本',ids,'目前还没有需要复习的错题，继续保持。','wrong')}
function favPage(){listPage('我的收藏',state.favorites.slice().sort((a,b)=>a-b),'还没有收藏题目。练习时点击“收藏”即可添加。','favorite')}
function setMastery(id){state.wrong[id]=state.wrong[id]||{count:1,streak:0};state.wrong[id].mastery='mastered';save();wrongPage();toast('已标记为掌握')}
function searchPage(){let query=$('#searchInput')?.value||'';$('#main').innerHTML=`<div class="pagehead"><div><h2>题目查询</h2><div class="sub">支持题号、题干、选项、知识点和命令关键词检索。</div></div></div><div class="toolbar"><input class="field search" id="searchInput" placeholder="输入题号或关键词，例如 FILLET、圆角、阵列" value="${esc(query)}"><select class="field" id="typeFilter"><option value="all">全部题型</option><option value="single">单选题</option><option value="multi">多选题</option><option value="judge">判断题</option></select><button class="btn primary" onclick="doSearch()">搜索</button></div><div id="searchResults" class="list"><div class="card empty">输入关键词开始检索题库。</div></div>`;$('#typeFilter').value=filterType;$('#searchInput').addEventListener('keydown',e=>{if(e.key==='Enter')doSearch()})}
function doSearch(){let text=$('#searchInput').value.trim().toLowerCase();filterType=$('#typeFilter').value;searchResult=Q.filter(q=>(filterType==='all'||q.type===filterType)&&(!text||([q.id,q.stem,q.knowledge,q.commands,q.detail,...q.options.map(o=>o.text)].join(' ').toLowerCase().includes(text))));let box=$('#searchResults');box.innerHTML=searchResult.length?searchResult.slice(0,100).map(q=>`<div class="listitem"><span class="pill">${q.id}</span><div class="grow"><h4>${esc(q.stem)}</h4><p>${qtype(q.type)} · ${esc(q.knowledge||'')}${q.status==='conflict'?' · 答案待核验':''}</p></div><button class="btn soft" onclick="openQuestion(${q.id})">查看</button></div>`).join(''):`<div class="card empty">没有找到符合条件的题目。</div>`;if(searchResult.length>100)box.innerHTML+=`<p class="muted">仅展示前 100 条结果，请缩小搜索范围。</p>`}
function examPage(){if(exam){if(exam.submitted){examResult(false);return}examScreen();return}let def={single:20,multi:10,judge:10};$('#main').innerHTML=`<div class="pagehead"><div><h2>模拟考试</h2><div class="sub">自定义题量与时长，模拟正式答题流程。</div></div></div><div class="card"><h3 class="section-title">考试设置</h3><div class="examsetup"><label>单选题数量<input class="field" id="exSingle" type="number" min="0" max="83" value="20"></label><label>多选题数量<input class="field" id="exMulti" type="number" min="0" max="50" value="10"></label><label>判断题数量<input class="field" id="exJudge" type="number" min="0" max="63" value="10"></label><label>考试时长（分钟）<input class="field" id="exMinutes" type="number" min="1" max="180" value="45"></label><label style="grid-column:span 2">题目范围<select class="field" id="exConflict"><option value="yes">排除争议题（推荐）</option><option value="no">包含全部题目</option></select></label></div><div class="notice" style="margin-top:16px">题目数量不能超过各题型可用数量。考试过程中可随时切换题目，交卷后显示成绩和逐题解析。</div><button class="btn primary" onclick="beginExam()">开始考试</button></div>${state.exams.length?`<div class="card" style="margin-top:14px"><h3 class="section-title">最近考试记录</h3>${state.exams.slice(0,8).map(e=>`<div class="resultrow"><span>${new Date(e.date).toLocaleString()} · ${e.total} 题</span><b>${e.score}%</b></div>`).join('')}</div>`:''}`}
function beginExam(){let nums=['Single','Multi','Judge'].map(x=>Math.max(0,Math.floor(Number($('#ex'+x).value)||0)));let max=[83,50,63];if(nums.some((n,i)=>n>max[i])||nums.every(n=>n===0)){toast('请检查题量设置');return}let exclude=$('#exConflict').value==='yes';let take=(type,n)=>{let pool=Q.filter(q=>q.type===type&&(!exclude||q.status!=='conflict'));if(n>pool.length)throw Error(`${qtype(type)}可用题目不足，当前最多 ${pool.length} 道`);return pool.sort(()=>Math.random()-.5).slice(0,n).map(q=>q.id)};try{let ids=[...take('single',nums[0]),...take('multi',nums[1]),...take('judge',nums[2])].sort(()=>Math.random()-.5);exam={ids,index:0,picks:{},duration:Math.max(1,Math.min(180,Number($('#exMinutes').value)||45))*60,end:Date.now()+Math.max(1,Math.min(180,Number($('#exMinutes').value)||45))*60000,submitted:false};examPage();startTimer()}catch(e){toast(e.message)}}
function startTimer(){clearInterval(timer);timer=setInterval(()=>{if(!exam)return;let left=Math.max(0,Math.ceil((exam.end-Date.now())/1000));let el=$('#timer');if(el)el.textContent=fmtTime(left);if(left<=0){clearInterval(timer);submitExam(true)}},500)}function fmtTime(n){return String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0')}
function examScreen(){let q=Q.find(x=>x.id===exam.ids[exam.index]);if(!q)return;let p=exam.picks[q.id]||[];let done=Object.values(exam.picks).filter(x=>x.length).length;$('#main').innerHTML=`<div class="pagehead"><div><h2>模拟考试</h2><div class="sub">第 ${exam.index+1} / ${exam.ids.length} 题 · 已作答 ${done} 题</div></div><div class="timer" id="timer">${fmtTime(Math.max(0,Math.ceil((exam.end-Date.now())/1000)))}</div></div><div class="card question"><div class="qmeta"><span class="pill">${qtype(q.type)}</span><span>题号 ${q.id}</span>${q.status==='conflict'?'<span class="pill amber">争议题</span>':''}</div><h3 class="qstem">${esc(q.stem)}</h3><div class="options">${q.options.map(o=>`<button class="option ${p.includes(o.key)?'selected':''}" onclick="examPick('${o.key}')"><span class="optkey">${o.key}</span><span class="opttext">${esc(o.text)}</span></button>`).join('')}</div><div class="qactions"><div class="group"><button class="btn" onclick="examMove(-1)" ${exam.index===0?'disabled':''}>上一题</button><button class="btn" onclick="examMove(1)" ${exam.index===exam.ids.length-1?'disabled':''}>下一题</button></div><button class="btn primary" onclick="confirmSubmit()">交卷</button></div><h3 class="section-title" style="margin-top:23px">答题卡</h3><div class="answergrid">${exam.ids.map((id,i)=>`<button class="${exam.picks[id]?.length?'done':''} ${i===exam.index?'current':''}" onclick="examGo(${i})">${i+1}</button>`).join('')}</div></div>`}
function examPick(k){let q=Q.find(x=>x.id===exam.ids[exam.index]);let p=exam.picks[q.id]||[];exam.picks[q.id]=q.type==='multi'?(p.includes(k)?p.filter(x=>x!==k):[...p,k]):[k];examScreen()}
function examMove(d){exam.index=Math.max(0,Math.min(exam.ids.length-1,exam.index+d));examScreen()}function examGo(i){exam.index=i;examScreen()}
function confirmSubmit(){let unanswered=exam.ids.filter(id=>!(exam.picks[id]||[]).length).length;if(unanswered&&!confirm(`还有 ${unanswered} 道题未作答，确定交卷吗？`))return;submitExam(false)}
function submitExam(auto){if(!exam||exam.submitted)return;clearInterval(timer);let right=0,detail=[];exam.ids.forEach(id=>{let q=Q.find(x=>x.id===id),p=exam.picks[id]||[],r=correct(q,p);if(r)right++;detail.push({id,p,answer:q.answer,correct:r});record(q,p,r)});exam.submitted=true;let result={date:Date.now(),total:exam.ids.length,right,score:Math.round(right/exam.ids.length*100),detail};state.exams.unshift(result);state.exams=state.exams.slice(0,50);save();exam=result;examResult(auto)}
function examResult(auto){$('#main').innerHTML=`<div class="pagehead"><div><h2>考试结果</h2><div class="sub">${auto?'考试时间结束，系统已自动交卷。':'已完成本次模拟考试。'}</div></div><button class="btn primary" onclick="exam=null;nav('exam')">返回考试</button></div><div class="card"><div style="text-align:center;padding:12px"><div class="muted">本次得分</div><div style="font-size:54px;font-weight:800;color:var(--primary)">${exam.score}<small style="font-size:18px">分</small></div><div>${exam.right} / ${exam.total} 题答对</div></div><div class="bar" style="margin:15px 0"><i style="width:${exam.score}%"></i></div><div class="resultrow"><span class="muted">正确题数</span><b>${exam.right}</b></div><div class="resultrow"><span class="muted">错误题数</span><b>${exam.total-exam.right}</b></div><div class="resultrow"><span class="muted">正确率</span><b>${exam.score}%</b></div></div><div class="card" style="margin-top:14px"><h3 class="section-title">逐题解析</h3><div class="list">${exam.detail.map(d=>{let q=Q.find(x=>x.id===d.id);return `<div class="listitem"><span class="pill ${d.correct?'green':'red'}">${d.correct?'正确':'错误'}</span><div class="grow"><h4>第 ${q.id} 题：${esc(q.stem)}</h4><p>你的答案：${d.p.join('、')||'未作答'} · 正确答案：${d.answer}</p></div><button class="btn soft" onclick="openQuestion(${q.id})">复习</button></div>`}).join('')}</div></div>`}
function statsPage(){let c=counts(),by={single:0,multi:0,judge:0};Q.forEach(q=>{if(state.attempts[q.id]?.total)by[q.type]++});let days=Object.entries(state.daily).sort((a,b)=>b[0].localeCompare(a[0])).slice(0,7);$('#main').innerHTML=`<div class="pagehead"><div><h2>学习统计</h2><div class="sub">记录答题积累与阶段性学习情况。</div></div><button class="btn" onclick="exportData()">导出学习数据</button></div><div class="grid stats"><div class="card"><div class="stat-label">累计答题</div><div class="stat-num">${c.total}</div></div><div class="card"><div class="stat-label">累计正确</div><div class="stat-num">${c.cor}</div></div><div class="card"><div class="stat-label">总体正确率</div><div class="stat-num">${c.rate}%</div></div><div class="card"><div class="stat-label">已练习题目</div><div class="stat-num">${c.tried}/${Q.length}</div></div></div><div class="grid homegrid"><div class="card"><h3 class="section-title">题型覆盖情况</h3>${[['single','单选题',BANK.meta.single],['multi','多选题',BANK.meta.multi],['judge','判断题',BANK.meta.judge]].map(([k,n,t])=>`<div style="margin:15px 0"><div class="row"><span>${n}</span><b>${by[k]} / ${t}</b></div><div class="bar" style="margin-top:7px"><i style="width:${by[k]/t*100}%"></i></div></div>`).join('')}</div><div class="card"><h3 class="section-title">最近每日学习</h3>${days.length?days.map(([d,x])=>`<div class="resultrow"><span class="muted">${d}</span><b>${x.answered} 题 · ${x.answered?Math.round(x.correct/x.answered*100):0}%</b></div>`).join(''):'<div class="empty">暂无学习记录</div>'}</div></div>`}
function exportData(){let blob=new Blob([JSON.stringify({app:'AutoCAD理论题库',version:1,exportedAt:new Date().toISOString(),state},null,2)],{type:'application/json'});download(blob,'AutoCAD学习记录_'+today()+'.json')}
function download(blob,name){let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function restoreData(file){let r=new FileReader();r.onload=()=>{try{let obj=JSON.parse(r.result);let x=obj.state||obj;if(!x||typeof x!=='object'||!x.attempts)throw Error('文件格式不正确');if(!confirm('导入将覆盖当前浏览器中的学习记录，建议先导出备份。继续吗？'))return;state={...fresh(),...x,settings:{...fresh().settings,...x.settings}};save();render();toast('学习记录导入成功')}catch(e){toast('导入失败：'+e.message)}};r.readAsText(file)}
function backupMenu(){let choice=prompt('数据管理：\n1 导出学习记录\n2 导入学习记录\n3 清空本地学习记录\n请输入 1、2 或 3');if(choice==='1')exportData();else if(choice==='2')$('#restoreFile').click();else if(choice==='3'&&confirm('确定清空所有答题记录、错题、收藏和考试记录？此操作不可撤销。')){state=fresh();save();render();toast('本地学习记录已清空')}}
$$('.nav').forEach(b=>b.addEventListener('click',()=>nav(b.dataset.page)));$('#themeBtn').onclick=()=>{state.theme=state.theme==='dark'?'light':'dark';save();render()};$('#backupBtn').onclick=backupMenu;$('#restoreFile').onchange=e=>{if(e.target.files[0])restoreData(e.target.files[0]);e.target.value=''};$('#sideTotal').textContent=Q.length;
// 浏览器快捷键：左右方向键切换练习题（输入框内除外）
document.addEventListener('keydown',e=>{if(e.target.matches('input,textarea,select'))return;if(state.page==='practice'&&session&&session.checked){if(e.key==='ArrowRight')nextQ();if(e.key==='ArrowLeft')prevQ()}});
render();
</script></body></html>
